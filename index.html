<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee House</title>
    <link
      rel="shortcut icon"
      href="./img/home/coffee-slider-2.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="logo">
          <img src="./img/logo.png" alt="logo" />
        </div>
        <nav class="header__nav">
          <ul class="nav__links">
            <li><a href="#">Favorite coffee</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Mobile app</a></li>
            <li><a href="#">Contact us</a></li>
          </ul>
        </nav>
        <div class="theme-toggle">
          <div class="theme-toggle__button">
            <img id="theme-toggle__sun" src="./img/Sun.svg" alt="Sun" />
          </div>
          <div class="theme-toggle__button">
            <img id="theme-toggle__moon" src="./img/Moon.svg" alt="Moon" />
          </div>
        </div>
        <div class="menu">
          <p id="menu-link">Menu</p>
          <img id="menu-cup" src="./img/coffee-cup.svg" alt="cup" />
        </div>
      </header>
      <main>
        <section class="hero"></section>
        <section class="favorite"></section>
        <section class="about"></section>
        <section class="mobile-app"></section>
      </main>
      <footer class="footer">
        <div class="footer__social">
          <h2>Sip, Savor, Smile.</br><span> It’s coffee time!</span></h2>
          <div class="social-links">
            <div class="social-link">
              <img src="./img/twitter.png" alt="twitter" />
            </div>
            <div class="social-link">
              <img src="./img/instagram.png" alt="instagram" />
            </div>
            <div class="social-link">
              <img src="./img/facebook.png" alt="facebook" />
            </div>
          </div>
        </div>
        <div class="footer__contacts-container">
          <h3>Contact us</h4>
          <div class="footer__contacts">
            <img src="./img/pin-alt.png" alt="pin-alt" />
            <a href="https://www.google.com/maps/place/%D0%AF%D0%BB%D1%82%D0%B0/@44.5006602,34.1334908,12.67z" target="_blank" rel="noopener">8558 Green Rd., LA</a>
          </div>
          <div class="footer__contacts">
            <img src="./img/phone.png" alt="phone" />
            <a href="tel:+1 (603) 555-0123">+1 (603) 555-0123</a>
          </div>
          <div class="footer__contacts">
            <img src="./img/clock.png" alt="clock" />
            <a>Mon–Sat: 9:00–23:00</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
